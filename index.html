<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Terminal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg1">

        <div class="content">

            <div class="terminal-top">
                <span>● SYSTEM ONLINE</span>
                <span>ENCRYPTION: ACTIVE</span>
            </div>

            <div id="own">

                <div class="terminal-symbol">
                    >
                </div>

                <h1>SECURE ACCESS</h1>

                <p>
                    UNAUTHORIZED SESSION DETECTED
                </p>

            </div>

            <div class="terminal-info">

                <div>
                    USER
                    <span>UNKNOWN</span>
                </div>

                <div>
                    STATUS
                    <span class="active">ACTIVE</span>
                </div>

                <div>
                    SECURITY
                    <span>ENCRYPTED</span>
                </div>

            </div>

            <div class="yes">

                <div class="question-line">
                    <span class="prompt">></span>
                    Do you want to continue?
                    <span class="cursor"></span>
                </div>

                <div class="buttons">

                    <button id="yesBtn">
                        [ YES ]
                    </button>

                    <button id="noBtn">
                        [ NO ]
                    </button>

                </div>

            </div>

            <div class="terminal-footer">

                <span>SYS://READY</span>

                <span id="message">
                    Awaiting user input...
                </span>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
